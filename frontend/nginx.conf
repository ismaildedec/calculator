server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # Serving the app and the API from one origin is what makes CORS irrelevant in this
    # setup. No trailing slash on proxy_pass, so /api/v1/add reaches the backend unchanged.
    location /api/ {
        proxy_pass       http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
